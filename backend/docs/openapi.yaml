openapi: 3.0.3
info:
  title: MiniTaskManager API
  version: 1.1.0
  description: |
    API REST para autenticacion de usuarios y gestion de tareas personales.
    Las rutas de tareas utilizan el usuario obtenido del token JWT.
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: http://localhost:5000/api
    description: Servidor local
  - url: https://backend-mocha-nu-99.vercel.app/api
    description: Backend desplegado en Vercel

tags:
  - name: Health
    description: Comprobacion basica de la API
  - name: Auth
    description: Registro, autenticacion y sesion
  - name: Tasks
    description: Tareas del usuario autenticado
  - name: Development
    description: Endpoints temporales de desarrollo

paths:
  /test:
    get:
      tags:
        - Health
      operationId: testApi
      summary: Comprueba que la API responde
      security: []
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResponse"
              example:
                message: Welcome to the Mini Task Manager API

  /auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Registra un usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              user: elias
              email: elias@correo.com
              password: pass123
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Datos invalidos o usuario/email existente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
              example:
                message: User or email already exists

  /auth/login:
    post:
      tags:
        - Auth
      operationId: loginUser
      summary: Inicia sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: elias@correo.com
              password: pass123
      responses:
        "200":
          description: Sesion iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales invalidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
              example:
                message: Invalid credentials

  /auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Obtiene el usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos publicos del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutUser
      summary: Cierra la sesion
      description: |
        El JWT es stateless. El backend confirma la operacion y el frontend
        elimina el token y el usuario guardados localmente.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sesion cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Logout successful
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tasks:
    get:
      tags:
        - Tasks
      operationId: getTasks
      summary: Lista las tareas del usuario
      description: |
        Devuelve las tareas filtradas y paginadas del usuario autenticado.
        TotalTasks y TotalPages corresponden a los filtros aplicados.
        UserStats contiene los totales generales del usuario sin filtros.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Resultado paginado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
              example:
                Tasks:
                  - _id: 667f20c6bcf86cd799439022
                    title: Comprar pan
                    description: Pasar por la panaderia
                    completed: false
                    user: 667f1f77bcf86cd799439011
                    createdAt: "2026-06-28T00:00:00.000Z"
                    updatedAt: "2026-06-28T00:00:00.000Z"
                Page: 1
                TotalPages: 1
                TotalTasks: 1
                UserStats:
                  Total: 20
                  Completed: 8
                  Pending: 12
        "400":
          description: Parametros de paginacion invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidPage:
                  value:
                    error: Page must be a positive integer
                invalidLimit:
                  value:
                    error: Limit must be a positive integer
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Tasks
      operationId: createTask
      summary: Crea una tarea
      description: |
        El propietario se obtiene de req.user._id. El cliente no debe enviar
        el campo user. El estado completed comienza en false.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            example:
              title: Comprar pan
              description: Pasar por la panaderia
      responses:
        "201":
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/all:
    get:
      tags:
        - Development
      operationId: getAllTasks
      summary: Obtiene todas las tareas
      description: |
        Endpoint temporal y no protegido. Devuelve tareas de todos los usuarios.
        Debe eliminarse o protegerse antes de trabajar con datos reales.
      deprecated: true
      security: []
      responses:
        "200":
          description: Lista completa de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tasks/{id}:
    put:
      tags:
        - Tasks
      operationId: updateTask
      summary: Actualiza una tarea
      description: Solo actualiza una tarea que pertenezca al usuario autenticado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
            example:
              title: Comprar pan y leche
              description: Pasar por la panaderia y el supermercado
              completed: true
      responses:
        "200":
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags:
        - Tasks
      operationId: toggleTask
      summary: Invierte el estado de una tarea
      description: |
        Cambia completed de false a true o de true a false. No requiere body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags:
        - Tasks
      operationId: deleteTask
      summary: Elimina una tarea
      description: Solo elimina una tarea que pertenezca al usuario autenticado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Tarea eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: ObjectId de la tarea
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
        example: 667f20c6bcf86cd799439022

    Search:
      name: search
      in: query
      required: false
      description: Texto buscado en titulo o descripcion sin distinguir mayusculas
      schema:
        type: string
      example: pan

    Status:
      name: status
      in: query
      required: false
      description: Filtra por el valor booleano de completed
      schema:
        type: string
        enum:
          - "true"
          - "false"
      example: "false"

    Page:
      name: page
      in: query
      required: false
      description: Numero de pagina
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad maxima de tareas por pagina
      schema:
        type: integer
        minimum: 1
        default: 10
      example: 5

  responses:
    Unauthorized:
      description: Token faltante, invalido, vencido o usuario inexistente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponse"
          examples:
            unauthorized:
              value:
                message: Not authorized
            expired:
              value:
                message: Not authorized
                code: TOKEN_EXPIRED

    BadRequest:
      description: Datos invalidos, tarea inexistente o tarea de otro usuario
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Task not found or user not authorized

    InternalServerError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageError"
          example:
            message: Internal server error

  schemas:
    TestResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterRequest:
      type: object
      properties:
        user:
          type: string
          example: elias
        email:
          type: string
          format: email
          example: elias@correo.com
        password:
          type: string
          format: password
          writeOnly: true
          example: pass123
      required:
        - user
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: elias@correo.com
        password:
          type: string
          format: password
          writeOnly: true
          example: pass123
      required:
        - email
        - password

    PublicUser:
      type: object
      properties:
        id:
          type: string
          example: 667f1f77bcf86cd799439011
        user:
          type: string
          example: elias
        email:
          type: string
          format: email
          example: elias@correo.com
      required:
        - id
        - user
        - email

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        token:
          type: string
          example: JWT_TOKEN
      required:
        - user
        - token

    CurrentUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - user

    CreateTaskRequest:
      type: object
      properties:
        title:
          type: string
          example: Comprar pan
        description:
          type: string
          example: Pasar por la panaderia
      required:
        - title

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          example: Comprar pan y leche
        description:
          type: string
          example: Pasar por la panaderia y el supermercado
        completed:
          type: boolean
          example: true
      minProperties: 1

    Task:
      type: object
      properties:
        _id:
          type: string
          example: 667f20c6bcf86cd799439022
        title:
          type: string
          example: Comprar pan
        description:
          type: string
          example: Pasar por la panaderia
        completed:
          type: boolean
          example: false
        user:
          type: string
          example: 667f1f77bcf86cd799439011
        createdAt:
          type: string
          format: date-time
          example: "2026-06-28T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-28T00:00:00.000Z"
      required:
        - _id
        - title
        - completed
        - user
        - createdAt
        - updatedAt

    TaskPage:
      type: object
      properties:
        Tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        Page:
          type: integer
          minimum: 1
          example: 1
        TotalPages:
          type: integer
          minimum: 0
          example: 1
        TotalTasks:
          type: integer
          minimum: 0
          example: 1
        UserStats:
          $ref: "#/components/schemas/UserStats"
      required:
        - Tasks
        - Page
        - TotalPages
        - TotalTasks
        - UserStats

    UserStats:
      type: object
      properties:
        Total:
          type: integer
          minimum: 0
          example: 20
        Completed:
          type: integer
          minimum: 0
          example: 8
        Pending:
          type: integer
          minimum: 0
          example: 12
      required:
        - Total
        - Completed
        - Pending

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    MessageError:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AuthErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          example: TOKEN_EXPIRED
        error:
          type: string
      required:
        - message
